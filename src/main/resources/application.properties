spring.application.name=backend
# Configuracion de la Base de Datos
spring.datasource.url=jdbc:postgresql://tu-db-instance.xxxx.us-east-1.rds.amazonaws.com:5432/bubblepat_db
spring.datasource.username=postgres
spring.datasource.password=tu_password_seguro

# Configuracion de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Para que el frontend (React) pueda consultar la API sin bloqueos
server.port=8080