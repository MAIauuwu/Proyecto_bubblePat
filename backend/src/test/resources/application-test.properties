# Perfil de test: usa H2 en memoria (no necesita PostgreSQL levantado).
# Sobrescribe application.properties para que el contexto de Spring cargue sin
# dependencias externas (BD, APIs, ni variables de entorno reales).

# --- Datasource H2 ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- Placeholders que en application.properties no tienen valor por defecto ---
jwt.secret=clave-de-test-super-secreta-y-muy-larga-para-cumplir-los-256-bits-de-hs256
api.ninjas.key=api-ninjas-key-de-test
DB_PASSWORD=

# --- Puerto aleatorio para evitar conflictos ---
server.port=0
