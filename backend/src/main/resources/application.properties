spring.application.name=backend

# PostgreSQL: credenciales desde variables de entorno / .env (no commitear valores reales)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bubblepat_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server (en producción AWS EC2 usamos 8081; PORT queda como variable opcional)
server.port=${PORT:8081}

# CORS: orígenes permitidos, separados por coma (variable de entorno CORS_ALLOWED_ORIGINS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# External APIs (API Ninjas) - clave desde .env
api.ninjas.key=${API_NINJAS_KEY}

# JWT - secreto desde .env
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000